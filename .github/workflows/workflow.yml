name: Build and Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Gladhen3.csproj

      - name: Build MSIX Package
        run: |
          msbuild Gladhen3.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true

      - name: Find and ZIP MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Filter "*.msix" -Recurse | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName -Destination "Gladhen3-x64.msix"
            Write-Host "Found MSIX: $($msix.FullName)"
          }
          $appinstaller = Get-ChildItem -Path . -Filter "*.appinstaller" -Recurse | Select-Object -First 1
          if ($appinstaller) {
            Copy-Item $appinstaller.FullName -Destination "Gladhen3.appinstaller"
          }
          # Also grab the whole package folder
          $pkgFolder = Get-ChildItem -Path . -Directory -Filter "*_Test" -Recurse | Select-Object -First 1
          if ($pkgFolder) {
            Compress-Archive -Path "$($pkgFolder.FullName)\*" -DestinationPath "Gladhen3-Sideload.zip" -Force
            Write-Host "Created sideload package from: $($pkgFolder.FullName)"
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gladhen3-MSIX
          path: |
            Gladhen3-x64.msix
            Gladhen3-Sideload.zip
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Gladhen3-MSIX

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Gladhen3 ${{ github.ref_name }}
          body: |
            ## Installation
            
            1. Download `Gladhen3-Sideload.zip`
            2. Extract the ZIP
            3. Right-click `Install.ps1` and select "Run with PowerShell"
            
            Or install the `.msix` file directly (requires developer mode or certificate trust).
          files: |
            Gladhen3-x64.msix
            Gladhen3-Sideload.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}