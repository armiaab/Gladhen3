name: Build and Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.${{ github.run_number }}"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Gladhen3.csproj -r win-x64

      - name: Build
        run: dotnet build Gladhen3.csproj -c Release -p:Platform=x64 --no-restore

      - name: Publish
        run: dotnet publish Gladhen3.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Create ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path publish/* -DestinationPath "Gladhen3-v$ver-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gladhen3-x64
          path: Gladhen3-*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Gladhen3-x64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Gladhen3 ${{ github.ref_name }}
          files: Gladhen3-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}