name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION_NAME: Gladhen3.sln
  PROJECT_PATH: Gladhen3.csproj
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
   uses: actions/setup-dotnet@v4
    with:
        dotnet-version: '8.0.x'

 - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_NAME }}

    - name: Extract version from tag or generate version
      id: version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
    $version = $matches[1]
        } else {
    $version = "1.0.${{ github.run_number }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    - name: Build C++ Shell Extension (x64)
      run: |
msbuild Interop/ShellExtension.vcxproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64 /verbosity:minimal
      continue-on-error: true

    - name: Build WinUI App
      run: |
   dotnet build ${{ env.PROJECT_PATH }} `
          --configuration ${{ env.CONFIGURATION }} `
  -p:Platform=${{ env.PLATFORM }} `
   -p:Version=${{ steps.version.outputs.VERSION }}

- name: Publish WinUI App (Self-Contained)
  run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
    --configuration ${{ env.CONFIGURATION }} `
       -p:Platform=${{ env.PLATFORM }} `
          -p:PublishProfile=win-${{ env.PLATFORM }} `
        -p:Version=${{ steps.version.outputs.VERSION }} `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=true `
   --output ./publish

    - name: Copy Shell Extension to publish folder
      shell: pwsh
      run: |
        $shellExtPath = "x64/${{ env.CONFIGURATION }}/ShellExtension.dll"
        if (Test-Path $shellExtPath) {
          Copy-Item $shellExtPath -Destination ./publish/ -Force
          Write-Host "Shell extension copied successfully"
        } else {
          Write-Host "Shell extension not found at $shellExtPath, skipping..."
        }

    - name: Create install script
   shell: pwsh
  run: |
        @'
        # Gladhen3 Installation Script
        # Run as Administrator

        param(
   [switch]$Uninstall
      )

        $ErrorActionPreference = "Stop"
        $AppName = "Gladhen3"
        $InstallPath = "$env:LOCALAPPDATA\$AppName"

    function Install-App {
  Write-Host "Installing $AppName..." -ForegroundColor Cyan
            
   # Create installation directory
        if (!(Test-Path $InstallPath)) {
  New-Item -ItemType Directory -Path $InstallPath -Force | Out-Null
   }
      
     # Copy files
            $ScriptDir = Split-Path -Parent $MyInvocation.ScriptName
        Copy-Item "$ScriptDir\*" -Destination $InstallPath -Recurse -Force -Exclude "install.ps1"

        # Register protocol handler
   $protocolKey = "HKCU:\Software\Classes\gladhen2"
            New-Item -Path $protocolKey -Force | Out-Null
    Set-ItemProperty -Path $protocolKey -Name "(Default)" -Value "URL:Gladhen3 Protocol"
     Set-ItemProperty -Path $protocolKey -Name "URL Protocol" -Value ""
        
          New-Item -Path "$protocolKey\shell\open\command" -Force | Out-Null
     Set-ItemProperty -Path "$protocolKey\shell\open\command" -Name "(Default)" -Value "`"$InstallPath\Gladhen3.exe`" `"%1`""
   
            # Create Start Menu shortcut
   $StartMenuPath = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
            $WshShell = New-Object -ComObject WScript.Shell
 $Shortcut = $WshShell.CreateShortcut("$StartMenuPath\$AppName.lnk")
       $Shortcut.TargetPath = "$InstallPath\Gladhen3.exe"
    $Shortcut.WorkingDirectory = $InstallPath
            $Shortcut.Save()
            
            Write-Host "$AppName installed successfully!" -ForegroundColor Green
            Write-Host "Location: $InstallPath" -ForegroundColor Gray
        }

        function Uninstall-App {
Write-Host "Uninstalling $AppName..." -ForegroundColor Cyan
 
    # Remove installation directory
     if (Test-Path $InstallPath) {
         Remove-Item -Path $InstallPath -Recurse -Force
            }
 
     # Remove protocol handler
  Remove-Item -Path "HKCU:\Software\Classes\gladhen2" -Recurse -Force -ErrorAction SilentlyContinue
          
  # Remove Start Menu shortcut
   $ShortcutPath = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\$AppName.lnk"
    if (Test-Path $ShortcutPath) {
   Remove-Item $ShortcutPath -Force
      }
            
            Write-Host "$AppName uninstalled successfully!" -ForegroundColor Green
        }

        if ($Uninstall) {
            Uninstall-App
        } else {
            Install-App
        }
'@ | Out-File -FilePath ./publish/install.ps1 -Encoding UTF8

    - name: Create ZIP archive
      shell: pwsh
 run: |
        $version = "${{ steps.version.outputs.VERSION }}"
      Compress-Archive -Path ./publish/* -DestinationPath "./Gladhen3-v$version-x64.zip" -Force

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gladhen3-x64
  path: ./Gladhen3-*.zip
        retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
     name: Gladhen3-x64

    - name: Extract version from tag
 id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
    echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
 uses: softprops/action-gh-release@v1
      with:
        name: Gladhen3 v${{ steps.version.outputs.VERSION }}
        body: |
 ## Gladhen3 v${{ steps.version.outputs.VERSION }}
        
      ### What's New
       - See commit history for changes
          
    ### Installation
          1. Download `Gladhen3-v${{ steps.version.outputs.VERSION }}-x64.zip`
          2. Extract to a folder of your choice
          3. Run `install.ps1` as Administrator (right-click > Run with PowerShell)
4. Or simply run `Gladhen3.exe` directly
 
          ### Features
      - Convert images to PDF
     - Merge multiple PDF files
          - Drag and drop support
          - Context menu integration
     - Customizable page size and margins
       
 ### System Requirements
   - Windows 10 version 1809 or later
     - x64 architecture
        files: |
          Gladhen3-*.zip
      draft: false
        prerelease: false
      env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
